# Minimal package configuration for the Step 1.8 repository skeleton.
# Structure only: no runtime dependencies, no application logic.
#
# Run the tests (standard library only, no install needed):
#   PYTHONPATH=src python3 -m unittest discover -s tests -v
# Or, if pytest is installed:
#   python3 -m pytest

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-investigation"
version = "0.0.0"
description = "NorthStar Retail delayed delivery investigation platform (repository skeleton; fictional company)"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
