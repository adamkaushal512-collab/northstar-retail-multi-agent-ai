# Minimal package configuration for the NorthStar repository.
# Runtime dependency: pydantic v2 (Step 2.5B investigation schema).
#
# Run the tests (install pydantic first, e.g. `pip install .`):
#   PYTHONPATH=src python3 -m unittest discover -s tests -v
# Or, if pytest is installed:
#   python3 -m pytest

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-investigation"
version = "0.0.0"
description = "NorthStar Retail delayed delivery investigation platform (repository skeleton; fictional company)"
requires-python = ">=3.11"
dependencies = [
    # Step 2.5B structured investigation schema (strict validation).
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Step 2.4B Bedrock experiment only (ADR-001 Proposed). Not needed for tests.
bedrock = ["boto3>=1.35"]
# Steps 3.3-3.4 LangGraph evidence graph and conditional routing only
# (ADR-002 Proposed). Its tests skip when this extra is not installed:
# `pip install .[langgraph]`.
langgraph = ["langgraph==1.2.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
